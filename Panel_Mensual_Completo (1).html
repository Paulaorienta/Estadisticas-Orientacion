<title>Panel de Evolución de Atenciones 2026 — Programa de Orientación PDV</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .page { max-width: 1180px; margin: 0 auto; }
  .header { background: #F2B705; color: #141414; padding: 20px 28px; border-radius: 12px; margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .header-title { font-size: 18px; font-weight: 800; }
  .header-sub { font-size: 14px; font-weight: 600; opacity: .88; margin-top: 4px; }
  .header-period { font-size: 14px; background: #C9900A; color: #141414; padding: 7px 18px; border-radius: 6px; font-weight: 800; letter-spacing: .2px; white-space: nowrap; }

  .month-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .month-btn { padding: 9px 16px; background: #FFF3CF; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; color: #4a4a46; cursor: pointer; }
  .month-btn.active { background: #F2B705; color: #141414; }
  .month-btn.total-btn { background: #EAE3D2; }
  .month-btn.total-btn.active { background: #3C4A45; color: #FFF8E7; }

  .view-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .view-btn { flex: 1; padding: 10px; text-align: center; background: #EAE3D2; border: none; border-radius: 8px; font-size: 13.5px; font-weight: 700; color: #4a4a46; cursor: pointer; }
  .view-btn.active { background: #3C4A45; color: #FFF8E7; }

  .kpi-row { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .kpi { background: #FFFFFF; border: 1px solid #EAE3D2; border-left: 4px solid #F2B705; border-radius: 10px; padding: 14px 22px; min-width: 150px; flex: 1; }
  .kpi-label { font-size: 11.5px; color: #726C5C; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .03em; }
  .kpi-value { font-size: 26px; font-weight: 800; }

  .section { background: #fff; border: 1px solid #EAE3D2; border-radius: 14px; padding: 22px 26px 26px; margin-bottom: 22px; }
  .section-title { font-size: 15px; font-weight: 700; color: #141414; margin-bottom: 4px; }
  .section-note { font-size: 12px; color: #726C5C; margin-bottom: 14px; font-style: italic; }
  .chart-wrap { position: relative; width: 100%; }
  .empty { font-size: 13px; color: #726C5C; padding: 20px 0; text-align: center; }
  .subsection { margin-top: 26px; padding-top: 22px; border-top: 1px solid #EAE3D2; }
  .subsection-title { font-size: 13.5px; font-weight: 700; color: #141414; margin-bottom: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th { text-align: center; padding: 9px 8px; background: #FFF3CF; color: #4a4a46; font-weight: 700; cursor: pointer; user-select: none; }
  th:first-child, th:nth-child(2) { text-align: left; }
  td { text-align: center; padding: 8px; border-bottom: 1px solid #EAE3D2; }
  td:first-child, td:nth-child(2) { text-align: left; }
  tr:hover td { background: #FFF9E6; }

  .footer { margin-top: 8px; text-align: center; font-size: 11.5px; color: #a39d8a; }
</style>
</head>

function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

// ---------- Aggregation helpers for "Total 2026" ----------
function mergeFlat(target, source) {
  Object.entries(source||{}).forEach(([k,v]) => { target[k] = (target[k]||0) + v; });
}
function mergeGroup(target, source) {
  // source: {grupo: {entidad: n}}
  Object.entries(source||{}).forEach(([grp, obj]) => {
    target[grp] = target[grp] || {};
    mergeFlat(target[grp], obj);
  });
}
function mergeNested(target, source) {
  // source: {entidad: {tema: n}}
  Object.entries(source||{}).forEach(([ent, obj]) => {
    target[ent] = target[ent] || {};
    mergeFlat(target[ent], obj);
  });
}

function getDetalleAtencionesParaVista(view) {
  // En el tab Total, solo suma el detalle Realizada/No realizada de los meses
  // que efectivamente aportan al total de esa vista (evita mezclar meses que
  // solo existen en la otra dimensión, como Enero que no tiene sede).
  const det = {};
  meses.forEach(m => {
    const md = data[m] || {};
    const tieneDatoEnVista = Object.values((md[view]||{}).Atenciones || {}).reduce((a,b)=>a+b,0) > 0;
    if (tieneDatoEnVista) mergeFlat(det, md.detalle_atenciones);
  });
  return det;
}
function getMonthData(mes) {
  if (mes !== 'Total') return data[mes] || {};

  const agg = {
    por_sede: {}, por_profesional: {}, detalle_atenciones: {},
    tema_total: {}, tema_plataforma: {},
    modalidad_atenciones_sede: {}, modalidad_atenciones_prof: {},
    modalidad_prematricula_sede: {}, modalidad_prematricula_prof: {}
  };
  meses.forEach(m => {
    const md = data[m] || {};
    mergeGroup(agg.por_sede, md.por_sede);
    mergeGroup(agg.por_profesional, md.por_profesional);
    mergeFlat(agg.detalle_atenciones, md.detalle_atenciones);
    mergeFlat(agg.tema_total, md.tema_total);
    mergeNested(agg.tema_plataforma, md.tema_plataforma);
    mergeNested(agg.modalidad_atenciones_sede, md.modalidad_atenciones_sede);
    mergeNested(agg.modalidad_atenciones_prof, md.modalidad_atenciones_prof);
    mergeNested(agg.modalidad_prematricula_sede, md.modalidad_prematricula_sede);
    mergeNested(agg.modalidad_prematricula_prof, md.modalidad_prematricula_prof);
  });
  return agg;
}

function simpleBar(canvasId, obj, color) {
  const entries = Object.entries(obj||{}).sort((a,b) => b[1]-a[1]);
  const labels = entries.map(e => e[0]);
  const values = entries.map(e => e[1]);
  const canvas = document.getElementById(canvasId);
  canvas.parentElement.style.height = Math.max(200, labels.length * 24) + 'px';
  destroyChart(canvasId);
  charts[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: color, borderRadius: 3, maxBarThickness: 18 }] },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ' ' + c.parsed.x.toLocaleString('es-CL') } } },
      layout: { padding: { right: 34 } },
      scales: {
        x: { beginAtZero: true, grid: { color: '#EAE3D2' }, ticks: { color: '#726C5C', font: { size: 11 } } },
        y: { grid: { display: false }, ticks: { color: '#141414', font: { size: 11.5 } } }
      }
    },
    plugins: [{
      id: 'dataLabels',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        chart.data.datasets[0].data.forEach((value, i) => {
          const bar = chart.getDatasetMeta(0).data[i];
          ctx.save(); ctx.fillStyle = '#141414'; ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText(value.toLocaleString('es-CL'), bar.x + 6, bar.y); ctx.restore();
        });
      }
    }]
  });
}

        x: { grid: { display: false }, ticks: { color: '#726C5C', font: { size: 11 } } },
        y: { beginAtZero: true, grid: { color: '#EAE3D2' }, ticks: { color: '#726C5C', font: { size: 11 } } }
      }
    },
    plugins: [{
      id: 'evolGroupedLabels',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        chart.data.datasets.forEach((ds, dsIdx) => {
          const meta = chart.getDatasetMeta(dsIdx);
          ds.data.forEach((value, i) => {
            if (!value) return;
            const bar = meta.data[i];
            ctx.save(); ctx.fillStyle = '#141414'; ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
            ctx.fillText(value.toLocaleString('es-CL'), bar.x, bar.y - 3); ctx.restore();
          });
        });
      }
    }]
  });
}

// ---------- HTML builders ----------
function sectionHTML(id, title, kpis, note) {
  return `<div class="section">
    <div class="section-title">${title}</div>
    ${note ? `<div class="section-note">${note}</div>` : ''}
    ${kpis ? `<div class="kpi-row">${kpis}</div>` : ''}
    <div class="chart-wrap"><canvas id="${id}"></canvas></div>
  </div>`;
}

function emptySection(title, msg) {
  return `<div class="section"><div class="section-title">${title}</div><div class="empty">${msg || ('Sin datos para ' + currentMonth + '.')}</div></div>`;
}

function kpi(label, value) {
  return `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div></div>`;
}



function renderPlataformaTable(temaPlataforma) {
  const PLATAFORMAS = ['App', 'Web'];
  const temasReales = Object.entries(temaPlataforma||{}).filter(([tema]) => tema !== 'Sin categoría');
  if (temasReales.length === 0 && !temaPlataforma['Sin categoría']) {
    return '<div class="empty">Sin datos de plataforma disponibles.</div>';
  }
  const entries = temasReales.sort((a,b) => {
    const totA = Object.values(a[1]).reduce((x,y)=>x+y,0);
    const totB = Object.values(b[1]).reduce((x,y)=>x+y,0);
    return totB - totA;
  });
  const rows = entries.map(([tema, plats]) => {
    const total = Object.values(plats).reduce((a,b)=>a+b,0);
    const cells = PLATAFORMAS.map(p => `<td>${(plats[p]||0).toLocaleString('es-CL')}</td>`).join('');
    return `<tr><td>${tema}</td>${cells}<td style="font-weight:700;">${total.toLocaleString('es-CL')}</td></tr>`;
  }).join('');

  // Fila especial: consultas registradas sin tema/plataforma en el archivo de origen
  const sinCategoria = temaPlataforma['Sin categoría'] || {};
  const totalSinCategoria = Object.values(sinCategoria).reduce((a,b)=>a+b,0);
  const filaSinDato = totalSinCategoria > 0
    ? `<tr><td>No figura en detalle de consulta</td><td>—</td><td>—</td><td style="font-weight:700;">${totalSinCategoria.toLocaleString('es-CL')}</td></tr>`
    : '';

  // % por plataforma calculado solo sobre consultas con plataforma conocida (App/Web)
  const grandTotalConocido = entries.reduce((acc,[,plats]) => acc + PLATAFORMAS.reduce((s,p) => s + (plats[p]||0), 0), 0);
  const totalsByPlat = PLATAFORMAS.map(p => entries.reduce((acc,[,plats]) => acc + (plats[p]||0), 0));
  const kpisPlataforma = PLATAFORMAS.map((p,i) => {
    const pct = grandTotalConocido > 0 ? (100*totalsByPlat[i]/grandTotalConocido).toFixed(1) : '0.0';
    return kpi(p, pct + '%');
  }).join('');

  return `<div class="kpi-row">${kpisPlataforma}</div>
    <div class="section-note">% calculado sobre las consultas con plataforma conocida (${grandTotalConocido.toLocaleString('es-CL')}).</div>
    <table>
      <thead><tr><th>Tema</th>${PLATAFORMAS.map(p=>`<th>${p}</th>`).join('')}<th>Total</th></tr></thead>
      <tbody>${rows}${filaSinDato}</tbody>
    </table>`;
}

function render() {
  const md = getMonthData(currentMonth);
  const view = md[currentView] || {};
  const isSede = currentView === 'por_sede';
  const dim = isSede ? 'sede' : 'profesional';
  const detalle = currentMonth === 'Total' ? getDetalleAtencionesParaVista(currentView) : (md.detalle_atenciones || {});

  const totalAt = Object.values(view.Atenciones||{}).reduce((a,b)=>a+b,0);
  const totalCo = Object.values(view.Consultas||{}).reduce((a,b)=>a+b,0);
  const totalDe = Object.values(view.Derivaciones||{}).reduce((a,b)=>a+b,0);

  const matricObjRaw = view.Matriculados || {};
  const noMatricObj = view.No_matriculados || {};
  const realizObj = view.Prematricula_realizadas || {};
  const noRealizObj = view.Prematricula_no_realizadas || {};
  const allKeysPremat = Array.from(new Set([...Object.keys(matricObjRaw), ...Object.keys(noMatricObj), ...Object.keys(realizObj)]));
  const matricObjCapped = {};
  let huboAjuste = false;
  allKeysPremat.forEach(k => {
    const raw = matricObjRaw[k]||0;
    const realiz = realizObj[k]||0;
    const capped = Math.min(raw, realiz);
    // Solo se muestra la entidad si tiene un respaldo real: seguimiento realizado con matrícula,
    // o un resultado de no-matrícula ya registrado. Si solo tiene matrícula sin seguimiento
    // realizado (como Scottie en Julio: derivado pero atención no concretada), se excluye del todo.
    if (capped > 0 || (noMatricObj[k]||0) > 0) matricObjCapped[k] = capped;
    if (raw > capped) huboAjuste = true;
  });
  const totalMatCapped = Object.values(matricObjCapped).reduce((a,b)=>a+b,0);
  const totalMatRaw = Object.values(matricObjRaw).reduce((a,b)=>a+b,0);
  const totalNoMat = Object.values(noMatricObj).reduce((a,b)=>a+b,0);
  const totalPrematRealiz = Object.values(realizObj).reduce((a,b)=>a+b,0);
  const totalPrematNoRealiz = Object.values(noRealizObj).reduce((a,b)=>a+b,0);
  const totalDerivados = totalPrematRealiz + totalPrematNoRealiz;

  let html = '';

  // ---- Evolución mensual (solo en Total 2026) ----
  if (currentMonth === 'Total') {
    const sumaEvol = (campo) => meses.reduce((acc, m2) => acc + (evolucionMensual[m2][campo]||0), 0);
    const totEvolAtenciones = sumaEvol('Atenciones');
    const totEvolConsultas = sumaEvol('Consultas');
    const totEvolDerivaciones = sumaEvol('Derivaciones');
    const totEvolDerivados = sumaEvol('Prematricula_realizadas') + sumaEvol('Prematricula_no_realizadas');
    const totEvolRealizadas = sumaEvol('Prematricula_realizadas');
    const totEvolMatriculados = sumaEvol('Matriculados');

    html += `<div class="section">
      <div class="section-title">Evolución mensual 2026</div>
      <div class="section-note">Totales por mes, sin diferenciar por sede o profesional.</div>

      <div class="subsection" style="margin-top:0; padding-top:0; border-top:none;">
        <div class="subsection-title">Atenciones</div>
        <div class="kpi-row">${kpi('Total 2026', totEvolAtenciones.toLocaleString('es-CL'))}</div>
        <div class="chart-wrap" style="height:220px;"><canvas id="c_evol_atenciones"></canvas></div>
      </div>

      <div class="subsection">
        <div class="subsection-title">Consultas / mensajería</div>
        <div class="kpi-row">${kpi('Total 2026', totEvolConsultas.toLocaleString('es-CL'))}</div>
        <div class="chart-wrap" style="height:220px;"><canvas id="c_evol_consultas"></canvas></div>
      </div>

      <div class="subsection">
        <div class="subsection-title">Prematrícula: Derivados, Realizadas y Matriculados</div>
        <div class="kpi-row">${kpi('Derivados', totEvolDerivados.toLocaleString('es-CL')) + kpi('Realizadas', totEvolRealizadas.toLocaleString('es-CL')) + kpi('Matriculados', totEvolMatriculados.toLocaleString('es-CL'))}</div>
        <div class="chart-wrap" style="height:260px;"><canvas id="c_evol_prematricula"></canvas></div>
      </div>

      <div class="subsection">
        <div class="subsection-title">Derivaciones</div>
        <div class="kpi-row">${kpi('Total 2026', totEvolDerivaciones.toLocaleString('es-CL'))}</div>
        <div class="chart-wrap" style="height:220px;"><canvas id="c_evol_derivaciones"></canvas></div>
      </div>

      <div class="subsection">
        <div class="subsection-title">Modalidad: ¿pesa tener presencia física en la sede?</div>
        <div class="section-note">Comparación de atenciones promedio por sede, agrupando según si la sede tuvo al menos una atención Presencial en el período (Febrero-Julio, único rango con este dato) o si operó 100% Virtual todo el período. La clasificación se calcula desde los datos reales, no desde una lista fija — por eso una sede como Chillán (que partió presencial y hoy opera virtual por licencia de la profesional) cuenta según lo que realmente ocurrió. No implica causalidad: podría ser que ya elegimos poner presencial donde sabíamos que había más demanda.</div>
        <div class="kpi-row" id="kpi_modalidad_peso"></div>
        <div class="chart-wrap" style="height:180px;"><canvas id="c_evol_modalidad_peso"></canvas></div>
      </div>

      <div class="subsection">
        <div class="subsection-title">Modalidad: evolución del % Presencial vs Virtual</div>
        <div class="section-note">Solo Febrero-Julio (Postulaciones y Enero no tienen este dato en su fuente).</div>
        <div class="chart-wrap" style="height:220px;"><canvas id="c_evol_modalidad_pct"></canvas></div>
      </div>
    </div>`;
  }

  // ---- Atenciones ----
  const atencionesNote = (isSede && (currentMonth === 'Postulaciones' || currentMonth === 'Enero' || currentMonth === 'Total'))
    ? 'El formulario que permite identificar Atenciones por sede se implementó a partir de Febrero 2026. Postulaciones y Enero solo tienen registro por profesional (esa vista sí las incluye completas).'
    : null;
  const detalleTotal = (detalle['Realizada']||0) + (detalle['No realizada']||0);
  const gapDetalle = totalAt - detalleTotal;
  let notaDetalle = null;
  if (detalleTotal === 0) {
    notaDetalle = 'Este período no distingue Realizada / No realizada en el archivo de origen.';
  } else if (gapDetalle > 0) {
    notaDetalle = `De este total, ${gapDetalle.toLocaleString('es-CL')} atención(es) — de Postulaciones — no tienen desglose Realizada / No realizada en su archivo de origen, por eso Realizadas + No realizadas no suma el Total.`;
  }
  if (totalAt > 0) {
    const kpisAtenciones = detalleTotal > 0
      ? kpi('Total', totalAt.toLocaleString('es-CL')) + kpi('Realizadas', (detalle['Realizada']||0).toLocaleString('es-CL')) + kpi('No realizadas', (detalle['No realizada']||0).toLocaleString('es-CL'))
      : kpi('Total', totalAt.toLocaleString('es-CL'));
    html += `<div class="section">
      <div class="section-title">Atenciones por ${dim}</div>
      ${[atencionesNote, notaDetalle].filter(Boolean).map(n=>`<div class="section-note">${n}</div>`).join('')}
      <div class="kpi-row">${kpisAtenciones}</div>
      <div class="chart-wrap"><canvas id="c_atenciones"></canvas></div>
    </div>`;
  } else {
    html += emptySection(`Atenciones por ${dim}`, atencionesNote || undefined);
  }

  // ---- Prematrícula ----
  if (totalPrematRealiz > 0 || totalMatRaw > 0 || totalNoMat > 0 || totalDerivados > 0) {
    const pct = totalPrematRealiz > 0 ? (100*totalMatCapped/totalPrematRealiz).toFixed(1) : null;
    const kpisPremat = kpi('Derivados', totalDerivados.toLocaleString('es-CL'))
      + kpi('Realizadas', totalPrematRealiz.toLocaleString('es-CL'))
      + kpi('Matriculados', totalMatCapped.toLocaleString('es-CL'))
      + (pct !== null ? kpi('% Matriculados', pct+'%') : '');
    html += `<div class="section">
      <div class="section-title">Prematrícula (seguimiento) por ${dim}</div>
      <div class="section-note">Derivados = casos asignados para atención (realizadas + no realizadas). Solo cuenta como Matriculado el/la estudiante que figura en el Académico.</div>
      <div class="kpi-row">${kpisPremat}</div>
      <div class="chart-wrap"><canvas id="c_prematricula"></canvas></div>
    </div>`;
  } else {
    html += emptySection(`Prematrícula (seguimiento) por ${dim}`);
  }

  // ---- Modalidad (Atenciones individuales + Prematrícula) ----
  const modAtObj = isSede ? (md.modalidad_atenciones_sede||{}) : (md.modalidad_atenciones_prof||{});
  const modPmObj = isSede ? (md.modalidad_prematricula_sede||{}) : (md.modalidad_prematricula_prof||{});
  const modCombinado = {};
  [modAtObj, modPmObj].forEach(obj => {
    Object.entries(obj).forEach(([entidad, vals]) => {
      modCombinado[entidad] = modCombinado[entidad] || { Presencial: 0, Virtual: 0 };
      modCombinado[entidad].Presencial += vals['Presencial']||0;
      modCombinado[entidad].Virtual += vals['Virtual']||0;
    });
  });
  const modCombinadoTotal = Object.values(modCombinado).reduce((acc,o) => acc + o.Presencial + o.Virtual, 0);
  if (modCombinadoTotal > 0) {
    html += `<div class="section">
      <div class="section-title">Modalidad de las atenciones por ${dim}</div>
      <div class="section-note">Incluye Atenciones individuales + Prematrícula (ambas son atención directa al estudiante/apoderado, solo cambia el motivo).</div>
      <div class="chart-wrap"><canvas id="c_modalidad"></canvas></div>
    </div>`;
  }

  // ---- Consultas + detalle por tema ----
  const temaTotal = md.tema_total || {};
  const temaPlataforma = md.tema_plataforma || {};
  const plataformaCombinada = (currentMonth === 'Postulaciones' || currentMonth === 'Enero');

  if (totalCo > 0) {
    html += `<div class="section">
      <div class="section-title">Consultas / mensajería por ${dim}</div>
      <div class="kpi-row">${kpi('Total', totalCo.toLocaleString('es-CL'))}</div>
      <div class="chart-wrap"><canvas id="c_consultas"></canvas></div>

      <div class="subsection">
        <div class="subsection-title">Detalle por tema</div>
        <div class="section-note">Incluye "Sin categoría": consultas registradas (con RUT, mes y quien respondió) que no tienen tema ni pregunta/respuesta detallada en el archivo de origen.</div>
        <div class="chart-wrap" id="wrap_tema"><canvas id="c_tema"></canvas></div>
      </div>

      <div class="subsection">
        <div class="subsection-title">Detalle por tema y plataforma (App / Web)</div>
        ${plataformaCombinada ? '<div class="section-note">Postulaciones y Enero comparten un mismo registro de origen en el archivo fuente: no se distinguen entre sí, por eso muestran el mismo desglose.</div>' : ''}
        <div class="section-note">"No figura en detalle de consulta" agrupa las consultas registradas (con RUT, mes y quien respondió) que llegaron sin tema ni plataforma en el archivo de origen — se cuentan igual, solo en el Total.</div>
        ${renderPlataformaTable(temaPlataforma)}
      </div>
    </div>`;
  } else {
    html += emptySection(`Consultas / mensajería por ${dim}`);
  }

  // ---- Derivaciones ----
  if (isSede) {
    html += totalDe > 0
      ? sectionHTML('c_derivaciones', 'Derivaciones por sede', kpi('Total', totalDe.toLocaleString('es-CL')))
      : emptySection('Derivaciones por sede');
  } else {
    html += `<div class="section"><div class="section-title">Derivaciones por profesional</div><div class="section-note">Esta fuente no registra profesional a propósito (el dato original es el docente que deriva, no el equipo de orientación).</div></div>`;
  }

  document.getElementById('content').innerHTML = html;

  if (modCombinadoTotal > 0) modalidadBar('c_modalidad', modCombinado);

  if (currentMonth === 'Total') {
    const evAt = meses.map(m => evolucionMensual[m].Atenciones);
    const evCo = meses.map(m => evolucionMensual[m].Consultas);
    const evDe = meses.map(m => evolucionMensual[m].Derivaciones);
    const evDerivados = meses.map(m => evolucionMensual[m].Prematricula_realizadas + evolucionMensual[m].Prematricula_no_realizadas);
    const evRealiz = meses.map(m => evolucionMensual[m].Prematricula_realizadas);
    const evMatCapped = meses.map(m => evolucionMensual[m].Matriculados);
    evolBarChart('c_evol_atenciones', evAt, '#1F4E4A');
    evolBarChart('c_evol_consultas', evCo, '#F2B705');
    evolBarChart('c_evol_derivaciones', evDe, '#C9900A');
    evolGroupedChart('c_evol_prematricula', [
      { label: 'Derivados', data: evDerivados, color: '#EAE3D2' },
      { label: 'Realizadas', data: evRealiz, color: '#1F4E4A' },
      { label: 'Matriculados', data: evMatCapped, color: '#C9900A' }
    ]);

    // --- Modalidad: peso de la presencia física (clasificación dinámica por sede) ---
    const mesesConModalidad = meses.filter(m => m !== 'Postulaciones' && m !== 'Enero');
    const sedeTotales = {};
    mesesConModalidad.forEach(m => {
      const md = data[m].modalidad_atenciones_sede || {};
      Object.entries(md).forEach(([sede, vals]) => {
        sedeTotales[sede] = sedeTotales[sede] || { Presencial: 0, Virtual: 0 };
        sedeTotales[sede].Presencial += vals['Presencial'] || 0;
        sedeTotales[sede].Virtual += vals['Virtual'] || 0;
      });
    });
    let nPres = 0, totPres = 0, nVirt = 0, totVirt = 0;
    Object.values(sedeTotales).forEach(v => {
      const tot = v.Presencial + v.Virtual;
      if (v.Presencial > 0) { nPres++; totPres += tot; }
      else { nVirt++; totVirt += tot; }
    });
    const promPres = nPres > 0 ? totPres / nPres : 0;
    const promVirt = nVirt > 0 ? totVirt / nVirt : 0;
    const razon = promVirt > 0 ? (promPres / promVirt).toFixed(1) : '—';

    document.getElementById('kpi_modalidad_peso').innerHTML =
      kpi('Sedes con presencia física', nPres) +
      kpi('Sedes 100% virtuales', nVirt) +
      kpi('Razón', razon + 'x');

    evolBarChart2Cat('c_evol_modalidad_peso',
      [`Con presencia física (${nPres} sedes)`, `100% virtuales (${nVirt} sedes)`],
      [Math.round(promPres*10)/10, Math.round(promVirt*10)/10],
      ['#C9900A', '#1F4E4A'], 'atenciones promedio / sede'
    );

    // --- Modalidad: % Presencial vs Virtual por mes ---
    const pctPresencial = mesesConModalidad.map(m => {
      const md = data[m].modalidad_atenciones_sede || {};
      let p = 0, v = 0;
      Object.values(md).forEach(vals => { p += vals['Presencial']||0; v += vals['Virtual']||0; });
      return (p+v) > 0 ? Math.round(1000*p/(p+v))/10 : 0;
    });
    const pctVirtual = pctPresencial.map(p => Math.round((100-p)*10)/10);

    evolStackedPct('c_evol_modalidad_pct', mesesConModalidad, pctPresencial, pctVirtual);
  }


  if (totalAt > 0) simpleBar('c_atenciones', view.Atenciones, '#1F4E4A');
  if (totalCo > 0) {
    simpleBar('c_consultas', view.Consultas, '#F2B705');
    temaBar('c_tema', temaTotal);
  }
  if (totalPrematRealiz > 0 || totalMatRaw > 0 || totalNoMat > 0 || totalDerivados > 0) groupedBar('c_prematricula', realizObj, matricObjCapped);
  if (isSede && totalDe > 0) simpleBar('c_derivaciones', view.Derivaciones, '#C9900A');
}

buildMonthTabs();
render();
</script>
</body>
</html>
